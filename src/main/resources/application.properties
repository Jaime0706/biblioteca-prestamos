spring.application.name=biblioteca-prestamos
server.port=8081

# Conexión a PostgreSQL. Los valores por defecto sirven para pruebas locales sin contraseña publicada:
# defina DB_URL, DB_USER y DB_PASSWORD como variables de entorno, o cree el archivo local
# src/main/resources/application-local.properties (ver application-local.properties.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Si existe application-local.properties (ignorado por Git), sus valores reemplazan a los anteriores.
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
